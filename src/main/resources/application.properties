spring.application.name=pruebaTecnicaTopaz

#Datos base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/bd_pruebatecnicatopaz
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Indicamos que muestre la sentencias sql ejecutadas por consola
spring.jpa.sql-show=true
#Indicamos que muestre las sentencias sql en formato SQL
spring.jpa.properties.hibernate.format_sql=true

#Ruta documentacion swagger: http://localhost:8080/swagger-ui/index.html
#Ruta documentacion api-docs: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui
